spring.application.name=liftly
server.port=${PORT:8080}

# PostgreSQL / Neon - configure these in Render > Environment
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html

spring.jpa.open-in-view=false

# Defina no Render e no ambiente local (minimo 32 caracteres)
JWT_SECRET=${JWT_SECRET}
# Expiracao do JWT em milissegundos (padrao 24 horas)
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
